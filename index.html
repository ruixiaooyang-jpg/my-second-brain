:root{

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);

button,input,select{font:inherit}

button:focus-visible,a:focus-visible,input:focus-visible,

header{background:#fff;border-bottom:1px solid var(--line)}

// Solve this bounded 2D LP by intersecting boundary lines.
// Every candidate must satisfy ALL inequalities.
function solve(a,b,r){
  const lines = [[1,1,r],[1,2,8],[1,0,0],[0,1,0]];
  const vertices = [];
  for(let i=0;i<lines.length;i++){
    for(let j=i+1;j<lines.length;j++){
      const [A,B,C]=lines[i], [D,E,F]=lines[j];
      const det=A*E-B*D;
      if(Math.abs(det)<1e-9) continue;
      let x=(C*E-B*F)/det, y=(A*F-C*D)/det;
      if(x>=-1e-9 && y>=-1e-9 && x+y<=r+1e-9 && x+2*y<=8+1e-9){
        x=Math.max(0,x); y=Math.max(0,y);
        if(!vertices.some(v=>Math.hypot(v.x-x,v.y-y)<1e-8))
          vertices.push({x,y,z:a*x+b*y});
      }
    }
  }
  const cx=vertices.reduce((s,v)=>s+v.x,0)/vertices.length;
  const cy=vertices.reduce((s,v)=>s+v.y,0)/vertices.length;
  vertices.sort((u,v)=>Math.atan2(u.y-cy,u.x-cx)-Math.atan2(v.y-cy,v.x-cx));
  const best=Math.max(...vertices.map(v=>v.z));
  return {vertices,best,winners:vertices.filter(v=>Math.abs(v.z-best)<1e-8)};
}

function drawGraph(){
  const a=+$("a").value,b=+$("b").value,r=+$("r").value;
  $("outA").textContent=a; $("outB").textContent=b; $("outR").textContent=r;
  $("constraints").innerHTML=`x + y ≤ ${r}<br>x + 2y ≤ 8<br>x, y ≥ 0`;
  const {vertices,best,winners}=solve(a,b,r);
  const fmt=n=>Number(n.toFixed(2));
  $("result").textContent = winners.length===1
    ? t(`最优解 (${fmt(winners[0].x)}, ${fmt(winners[0].y)})；z* = ${fmt(best)}`,
        `Optimal solution (${fmt(winners[0].x)}, ${fmt(winners[0].y)}); z* = ${fmt(best)}`)
    : t(`存在多个最优解：高亮线段上所有点均最优；z* = ${fmt(best)}`,
        `Multiple optima: every point on the highlighted segment is optimal; z* = ${fmt(best)}`);
  const X=x=>60+60*x, Y=y=>400-40*y;
  let s=`<title id="plotTitle">${t("二维线性规划图","Two-dimensional linear program")}</title>
    <desc id="plotDesc">${$("result").textContent}</desc>
    <defs><clipPath id="clip"><rect x="60" y="80" width="480" height="320"/></clipPath></defs>`;
  for(let i=0;i<=8;i++){
    s+=`<path d="M${X(i)} 80V400 M60 ${Y(i)}H540" stroke="#e5edf1" fill="none"/>
      <text x="${X(i)}" y="423" text-anchor="middle" font-size="13" fill="#566b7b">${i}</text>
      <text x="43" y="${Y(i)+4}" text-anchor="end" font-size="13" fill="#566b7b">${i}</text>`;
  }
  s+=`<polygon points="${vertices.map(v=>`${X(v.x)},${Y(v.y)}`).join(" ")}"
      fill="#b7e4d6" stroke="#006d77" stroke-width="2"/>
    <g clip-path="url(#clip)">
      <path d="M${X(0)} ${Y(r)}L${X(r)} ${Y(0)}" stroke="#3279ba" stroke-width="3"/>
      <path d="M${X(0)} ${Y(4)}L${X(8)} ${Y(0)}" stroke="#9b70ba" stroke-width="3"/>
      <path d="M${X(0)} ${Y(best/b)}L${X(best/a)} ${Y(0)}"
        stroke="#c4760d" stroke-width="3" stroke-dasharray="8 5"/>
    </g>`;
  if(winners.length>1){
    s+=`<line x1="${X(winners[0].x)}" y1="${Y(winners[0].y)}"
      x2="${X(winners[1].x)}" y2="${Y(winners[1].y)}" stroke="#c4760d" stroke-width="6"/>`;
  }
  vertices.forEach(v=>{
    s+=`<circle cx="${X(v.x)}" cy="${Y(v.y)}" r="5" fill="#006d77"/>
      <text x="${X(v.x)+8}" y="${Y(v.y)-10}" font-size="13" fill="#172c40">(${fmt(v.x)}, ${fmt(v.y)})</text>`;
  });
  winners.forEach(v=>{
    s+=`<circle cx="${X(v.x)}" cy="${Y(v.y)}" r="8" fill="#c4760d" stroke="white" stroke-width="2"/>`;
  });
  s+=`<path d="M60 70V400H552" stroke="#172c40" fill="none" stroke-width="2"/>
    <text x="564" y="405" font-size="18">x</text><text x="54" y="57" font-size="18">y</text>`;
  $("plot").innerHTML=s;
}

    <p class="muted">上方图形默认参数对应本例。调整滑块仅改变实验模型，不改变此处固定例题。</p>
  `,`
    <span class="tag">Original teaching example · Not course material</span>
    <h3>Production planning: two divisible products</h3>
    <p>A workshop produces A and B in continuous batches. All output can be sold, and per-batch resource use and profit remain constant.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Per-batch requirement / return</th><th>A</th><th>B</th><th>Capacity</th></tr></thead>
      <tbody><tr><td>Labor (hours)</td><td>1</td><td>1</td><td>4</td></tr>
      <tr><td>Machine time (hours)</td><td>1</td><td>2</td><td>8</td></tr>
      <tr><td>Profit (hundreds of AUD)</td><td>3</td><td>2</td><td>—</td></tr></tbody>
    </table></div>
    <h3>1 · Formulate</h3>
    <p>Let x and y be batches of A and B. Both are continuous nonnegative variables.</p>
    <div class="formula">max z = 3x + 2y<br>x + y ≤ 4<br>x + 2y ≤ 8<br>x, y ≥ 0</div>
    <h3>2 · Solve</h3>
    <p>Intersect the constraints in the nonnegative quadrant. The feasible vertices are (0,0), (4,0) and (0,4). The resource boundaries meet at (0,4). Here the machine constraint is redundant because x+2y ≤ 2(x+y) ≤ 8.</p>
    <p>The objective values at these vertices are 0, 12 and 8. Therefore (4,0) is optimal.</p>
    <h3>3 · Interpret</h3>
    <p>Produce 4 batches of A and none of B, earning 12 hundreds of AUD, or A$1,200. This uses 4 labor hours and 4 machine hours, leaving 0 labor hours and 4 machine hours unused.</p>
    <p class="muted">The graph's default parameters match this example. Slider changes affect only the experimental model, not this fixed example.</p>
  `);
}

// Events are registered once. Language changes preserve answers and sliders.
$("language").onclick=()=>{lang=lang==="zh"?"en":"zh";render()};
$("search").oninput=renderKnowledge;
$("category").onchange=renderKnowledge;
["a","b","r"].forEach(id=>$(id).oninput=drawGraph);
$("resetGraph").onclick=()=>{
  $("a").value=3;$("b").value=2;$("r").value=4;drawGraph();
};
$("questions").onchange=event=>{
  if(event.target.type!=="radio")return;
  answers[Number(event.target.name.slice(1))]=Number(event.target.value);
  // Hide stale scores if answers change after submission.
  if(submitted){submitted=false;renderQuiz()}
};
$("quizForm").onsubmit=event=>{
  event.preventDefault();submitted=true;renderQuiz();
};
$("resetQuiz").onclick=()=>{
  Object.keys(answers).forEach(key=>delete answers[key]);
  submitted=false;renderQuiz();
};
KnowledgeManager.init();
render();
</script>
